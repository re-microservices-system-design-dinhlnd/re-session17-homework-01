server:
  port: 8080

spring:
  application:
    name: grabfood-cache-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10

logging:
  level:
    com.grabfood: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.cache: DEBUG
